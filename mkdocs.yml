---
site_name: insecure-tree
site_url: https://insecure_tree.readthedocs.io/
site_author: Matthew Martin <matthewdeanmartin@gmail.com>
site_description: Audit GitHub Actions security posture of your Python dependency tree using zizmor
repo_url: https://github.com/matthewdeanmartin/insecure_tree
theme:
  name: readthedocs
  features: [navigation.footer]
edit_uri: edit/main/docs/
markdown_extensions:
  - attr_list
  - codehilite
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Overview: overview/README.md
  - Installation: installation.md
  - Usage:
      - Quick Start: usage/quickstart.md
      - CLI Reference: usage/cli.md
      - Configuration: usage/configuration.md
      - CI Integration: usage/ci.md
  - Concepts:
      - How It Works: concepts/how_it_works.md
      - Dependency Sources: concepts/sources.md
      - GitHub URL Extraction: concepts/github_urls.md
      - Reports: concepts/reports.md
  - Contributing: extending/CONTRIBUTING.md
  - Change Log: CHANGELOG.md
validation:
  nav:
    omitted_files: warn
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
